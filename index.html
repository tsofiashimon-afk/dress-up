<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dress Up Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: character stage on the left, tabbed clothing catalog on the right; stacks (stage on top) on phones. */
:root{
  --bg:#f1eefb; --panel:#ffffff; --fg:#1f1a33; --muted:#6a6485; --line:#ddd7f0;
  --accent:#6a49f2; --accent-fg:#ffffff; --tile:#f5f2fd; --tile-hover:#ece7fb;
  --font-display:'Fredoka',ui-rounded,system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --stage:linear-gradient(160deg,#ffd9e8,#cdb8ff);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141220; --panel:#1e1b30; --fg:#f1eefc; --muted:#a8a2c6; --line:#342f4f;
    --accent:#a18bff; --accent-fg:#16112e; --tile:#28243f; --tile-hover:#322d4e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141220; --panel:#1e1b30; --fg:#f1eefc; --muted:#a8a2c6; --line:#342f4f;
  --accent:#a18bff; --accent-fg:#16112e; --tile:#28243f; --tile-hover:#322d4e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:600 15px/1.4 var(--font-body);overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:16px;padding:16px}
.stage-wrap{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:600 28px/1.1 var(--font-display);letter-spacing:.2px;text-wrap:balance}
.actions{display:flex;gap:8px}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:800}
.btn:hover{background:var(--tile-hover)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}

.stage{flex:1;min-height:0;border-radius:24px;background:var(--stage);overflow:hidden;position:relative;transition:background .3s}
.stage svg{width:100%;height:100%;display:block}
.stage .hint{position:absolute;left:14px;bottom:12px;margin:0;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.72);color:#2a2540;font-size:13px;font-weight:700;max-width:calc(100% - 28px)}
#fig{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){#fig{animation:none}.stage{transition:none}}

.catalog{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.tabs{display:flex;gap:6px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
.tab{flex:none;padding:8px 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}
.tab:hover{background:var(--tile)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.panel{flex:1;min-height:0;overflow-y:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 6px;border:2px solid transparent;border-radius:16px;background:var(--tile);cursor:pointer;min-width:0}
.tile:hover{background:var(--tile-hover)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.tile svg{width:100%;height:auto;display:block;aspect-ratio:var(--ar);max-height:150px}
.tile .nm{font-size:13px;font-weight:800;text-align:center;overflow-wrap:anywhere}
.tile.none .blank{width:100%;aspect-ratio:var(--ar);max-height:150px;display:grid;place-items:center;color:var(--muted);font-size:30px;font-weight:700}

.colors{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.sw.big{width:46px;height:46px}
.sw.bg{width:62px;height:46px;border-radius:14px}
.look-block{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,44%) minmax(0,1fr);gap:10px;padding:12px 16px}
  h1{font-size:22px}
  .btn{padding:7px 12px}
  .stage .hint{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
}
</style>

<div class="app">
  <section class="stage-wrap">
    <header class="top">
      <h1>Dress Up Studio</h1>
      <div class="actions">
        <button class="btn primary" id="random" type="button">Surprise me</button>
        <button class="btn" id="reset" type="button">Reset</button>
      </div>
    </header>
    <div class="stage" id="stage">
      <svg viewBox="0 0 300 545" role="img" aria-label="Your character" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="150" cy="531" rx="84" ry="8" fill="#000" opacity=".14"/>
        <g id="fig"></g>
      </svg>
      <p class="hint" id="hint">Pick items from the catalog to dress your character.</p>
    </div>
  </section>

  <aside class="catalog" aria-label="Clothing catalog">
    <div class="tabs" id="tabs" role="tablist" aria-label="Catalog categories"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
    <div class="colors" id="colors"></div>
  </aside>
</div>
<div class="sr" id="status" role="status" aria-live="polite"></div>

function shade(hex,a){
  const n=parseInt(hex.slice(1),16);

  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

 {key:'hats',label:'Hats',palette:CLOTHC,view:[50,-20,200,200],items:[

  {id:'cap',name:'Cap',art:c=>`<path d="M110 68 Q108 30 150 28 Q192 30 190 68Z" fill="${c}"/><path d="M100 68 Q150 56 200 68 Q210 76 196 80 Q150 70 104 80 Q90 76 100 68Z" fill="${shade(c,-.25)}"/><circle cx="150" cy="29" r="4" fill="${shade(c,-.25)}"/>`},
  {id:'sun',name:'Sun hat',art:c=>`<ellipse cx="150" cy="56" rx="92" ry="15" fill="${c}"/><path d="M114 56 Q112 18 150 16 Q188 18 186 56Z" fill="${c}"/><path d="M113 46 Q150 56 187 46 L186 56 Q150 66 114 56Z" fill="${shade(c,-.28)}"/><path d="M70 56 Q150 74 230 56" stroke="${shade(c,-.15)}" stroke-width="2" fill="none" opacity=".6"/>`},
  {id:'crown',name:'Crown',art:c=>`<path d="M114 58 L108 22 L130 40 L150 14 L170 40 L192 22 L186 58Z" fill="${c}"/><rect x="114" y="50" width="72" height="9" fill="${shade(c,-.25)}"/><circle cx="150" cy="38" r="4.5" fill="#ef476f"/><circle cx="132" cy="54" r="3" fill="#06d6a0"/><circle cx="168" cy="54" r="3" fill="#118ab2"/>`},
  {id:'bow',name:'Hair bow',art:c=>`<path d="M172 48 L146 34 L146 62Z" fill="${c}"/><path d="M172 48 L198 34 L198 62Z" fill="${c}"/><circle cx="172" cy="48" r="7" fill="${shade(c,-.25)}"/>`},
  {id:'cat',name:'Cat ears',art:c=>`<path d="M112 64 Q150 26 188 64" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>${mirror(`<path d="M112 56 L108 16 L138 38Z" fill="${c}"/><path d="M116 46 L114 27 L128 38Z" fill="#ffb3c7"/>`)}`}
 ]},
 {key:'glasses',label:'Glasses',palette:CLOTHC,view:[88,40,124,124],items:[
  {id:'round',name:'Round',art:c=>`<g fill="#fff" fill-opacity=".18" stroke="${c}" stroke-width="3"><circle cx="136" cy="89" r="12"/><circle cx="164" cy="89" r="12"/></g><path d="M148 87 Q150 84 152 87M124 86 L112 84M176 86 L188 84" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`},
  {id:'shades',name:'Shades',art:c=>`<g fill="#1d1b2a" stroke="${c}" stroke-width="3"><rect x="122" y="78" width="27" height="20" rx="7"/><rect x="151" y="78" width="27" height="20" rx="7"/></g><path d="M149 84H151M122 82 L112 80M178 82 L188 80" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M127 83 L134 83M156 83 L163 83" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5"/>`},
  {id:'heart',name:'Hearts',art:c=>mirror(`<path transform="translate(136 88)" d="M0 9 C-19 -4 -11 -19 0 -10 C11 -19 19 -4 0 9Z" fill="${c}" stroke="${shade(c,-.3)}" stroke-width="2"/>`)+`<path d="M146 86 L154 86" stroke="${shade(c,-.3)}" stroke-width="3"/>`}
 ]},
 {key:'extras',label:'Extras',palette:CLOTHC,view:[10,100,280,300],items:[
  {id:'scarf',name:'Scarf',art:c=>`<path d="M126 126 Q150 142 174 126 L178 148 Q150 164 122 148Z" fill="${c}"/><path d="M156 150 L178 146 L184 228 L160 224Z" fill="${shade(c,-.2)}"/><path d="M158 182 L182 178M159 202 L183 198" stroke="${shade(c,.35)}" stroke-width="3" opacity=".7"/>`},
  {id:'pearls',name:'Necklace',art:c=>{let s='';for(let i=0;i<=12;i++){const t=i/12;s+=`<circle cx="${(126+48*t).toFixed(1)}" cy="${(134+28*Math.sin(Math.PI*t)).toFixed(1)}" r="4" fill="${c}" stroke="${shade(c,-.3)}" stroke-width="1"/>`;}return s;}},
  {id:'cape',name:'Cape',back:c=>`<path d="M112 146 L188 146 L236 410 Q150 430 64 410Z" fill="${c}"/><path d="M112 146 L188 146 L180 160 L120 160Z" fill="${shade(c,-.25)}"/>`,art:c=>`<circle cx="132" cy="152" r="5" fill="#ffd166"/><circle cx="168" cy="152" r="5" fill="#ffd166"/><path d="M132 152 Q150 162 168 152" stroke="#ffd166" stroke-width="2.5" fill="none"/>`},
  {id:'wings',name:'Wings',back:c=>mirror(`<path d="M110 168 Q40 90 14 130 Q34 138 24 164 Q50 160 44 196 Q78 190 76 226 Q104 216 112 200Z" fill="${c}"/><path d="M104 176 Q60 130 34 142M100 190 Q62 168 44 176M100 204 Q76 196 66 206" stroke="${shade(c,-.25)}" stroke-width="2" fill="none" opacity=".6"/>`)}
 ]}
];
const ITEMS={};
CATS.forEach(c=>{ITEMS[c.key]={};c.items.forEach(i=>{ITEMS[c.key][i.id]=i;});});

/* ---------- compose a figure ---------- */
function figure(sel,colors,skin){
  SKIN=skin;
  const it=k=>sel[k]?ITEMS[k][sel[k]]:null;
  const hair=it('hair'),hat=it('hats'),gl=it('glasses'),top=it('tops'),bot=it('bottoms'),dr=it('dresses'),sh=it('shoes'),ex=it('extras');
  let o='';
  if(hair&&hair.back) o+=hair.back(colors.hair);
  if(ex&&ex.back) o+=ex.back(colors.extras);
  o+=body(skin);
  if(!dr){ if(!top) o+=basicTop(); if(!bot) o+=basicBottom(); }
  if(sh) o+=sh.art(colors.shoes);
  if(bot&&!dr) o+=bot.art(colors.bottoms);
  if(top&&!dr) o+=top.art(colors.tops);
  if(dr) o+=dr.art(colors.dresses);
  if(ex&&ex.art) o+=ex.art(colors.extras);
  if(hair) o+=hair.art(colors.hair);
  if(gl) o+=gl.art(colors.glasses);
  if(hat) o+=hat.art(colors.hats);
  return o;
}

/* ---------- state ---------- */
const KEY='dressup-studio-v1';
const defaults=()=>({skin:1,bg:0,sel:{hair:'short',hats:null,glasses:null,tops:null,bottoms:null,dresses:null,shoes:null,extras:null},colors:Object.assign({},DEFAULT_COLORS)});
let S=defaults();
let tab='tops';

function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return;
    const p=JSON.parse(raw), d=defaults();
    if(Number.isInteger(p.skin)&&p.skin>=0&&p.skin<SKINS.length) d.skin=p.skin;
    if(Number.isInteger(p.bg)&&p.bg>=0&&p.bg<BACKDROPS.length) d.bg=p.bg;
    CATS.forEach(c=>{
      const id=p.sel&&p.sel[c.key];
      d.sel[c.key]=(id&&ITEMS[c.key][id])?id:(id===null?null:d.sel[c.key]);
      const col=p.colors&&p.colors[c.key];
      if(typeof col==='string'&&/^#[0-9a-f]{6}$/i.test(col)) d.colors[c.key]=col;
    });
    S=d;
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- rendering ---------- */
const $=id=>document.getElementById(id);
const fig=$('fig'),stage=$('stage'),panel=$('panel'),tabsEl=$('tabs'),colorsEl=$('colors'),hint=$('hint'),status=$('status');

function renderStage(){
  fig.innerHTML=figure(S.sel,S.colors,SKINS[S.skin]);
  stage.style.setProperty('--stage',BACKDROPS[S.bg]);
  stage.style.background=BACKDROPS[S.bg];
}
function describe(){
  const worn=[];
  CATS.forEach(c=>{const id=S.sel[c.key]; if(id) worn.push(ITEMS[c.key][id].name.toLowerCase()+(c.key==='hair'?' hair':''));});
  return worn.length?'Wearing: '+worn.join(', ')+'.':'Basic outfit.';
}
function announce(){const t=describe();hint.textContent=t;status.textContent=t;}

function buildTabs(){
  const labels=CATS.map(c=>({key:c.key,label:c.label})).concat([{key:'look',label:'Look'}]);
  tabsEl.innerHTML=labels.map(t=>`<button class="tab" role="tab" id="tab-${t.key}" data-tab="${t.key}" aria-selected="${t.key===tab}" tabindex="${t.key===tab?0:-1}">${t.label}</button>`).join('');
}
function buildPanel(){
  if(tab==='look'){
    panel.innerHTML=`<div class="look-block"><span class="label">Skin tone</span><div class="swatches">${SKINS.map((s,i)=>`<button class="sw big" data-skin="${i}" style="background:${s}" aria-label="Skin tone ${i+1}" aria-pressed="${i===S.skin}"></button>`).join('')}</div></div>
    <div class="look-block"><span class="label">Backdrop</span><div class="swatches">${BACKDROPS.map((b,i)=>`<button class="sw bg" data-bg="${i}" style="background:${b}" aria-label="Backdrop ${i+1}" aria-pressed="${i===S.bg}"></button>`).join('')}</div></div>`;
    colorsEl.hidden=true;
    return;
  }
  const cat=CATS.find(c=>c.key===tab);
  const [x,y,w,h]=cat.view, ar=`${w} / ${h}`;
  const tiles=[`<button class="tile none" data-id="" aria-pressed="${!S.sel[cat.key]}" style="--ar:${ar}"><span class="blank">&#8856;</span><span class="nm">None</span></button>`];
  cat.items.forEach(item=>{
    const sel={[cat.key]:item.id};
    const svg=`<svg viewBox="${x} ${y} ${w} ${h}" style="--ar:${ar}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${figure(sel,S.colors,SKINS[S.skin])}</svg>`;
    tiles.push(`<button class="tile" data-id="${item.id}" aria-pressed="${S.sel[cat.key]===item.id}" aria-label="${item.name}">${svg}<span class="nm">${item.name}</span></button>`);
  });
  panel.innerHTML=`<div class="grid">${tiles.join('')}</div>`;
  buildColors(cat);
}
function buildColors(cat){
  colorsEl.hidden=false;
  colorsEl.innerHTML=`<span class="label">Color</span><div class="swatches">${cat.palette.map(c=>`<button class="sw" data-color="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${S.colors[cat.key].toLowerCase()===c}"></button>`).join('')}</div>`;
}
function refreshPressed(){
  panel.querySelectorAll('.tile').forEach(t=>{
    t.setAttribute('aria-pressed',String((t.dataset.id||null)===(S.sel[tab]||null)));
  });
}

/* ---------- actions ---------- */
function choose(cat,id){
  const next=(id&&S.sel[cat]!==id)?id:null;
  S.sel[cat]=next;
  if(next&&cat==='dresses'){S.sel.tops=null;S.sel.bottoms=null;}
  if(next&&(cat==='tops'||cat==='bottoms')) S.sel.dresses=null;
  renderStage(); refreshPressed(); announce(); save();
}
function setTab(k){
  tab=k; buildTabs(); buildPanel(); panel.scrollTop=0;
  panel.setAttribute('aria-labelledby','tab-'+k);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function randomize(){
  const s=defaults().sel;
  s.hair=pick(CATS.find(c=>c.key==='hair').items).id;
  S.colors.hair=pick(HAIRC);
  if(Math.random()<.32){
    s.dresses=pick(CATS.find(c=>c.key==='dresses').items).id; S.colors.dresses=pick(CLOTHC);
  }else{
    s.tops=pick(CATS.find(c=>c.key==='tops').items).id; S.colors.tops=pick(CLOTHC);
    s.bottoms=pick(CATS.find(c=>c.key==='bottoms').items).id; S.colors.bottoms=pick(CLOTHC);
  }
  if(Math.random()<.85){s.shoes=pick(CATS.find(c=>c.key==='shoes').items).id;S.colors.shoes=pick(CLOTHC);}
  if(Math.random()<.45){s.hats=pick(CATS.find(c=>c.key==='hats').items).id;S.colors.hats=pick(CLOTHC);}
  if(Math.random()<.35){s.glasses=pick(CATS.find(c=>c.key==='glasses').items).id;S.colors.glasses=pick(CLOTHC);}
  if(Math.random()<.35){s.extras=pick(CATS.find(c=>c.key==='extras').items).id;S.colors.extras=pick(CLOTHC);}
  S.sel=s;
  renderStage(); buildPanel(); announce(); save();
}

tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab);});
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
  const keys=CATS.map(c=>c.key).concat(['look']);
  const i=keys.indexOf(tab), n=(i+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length;
  setTab(keys[n]); const t=$('tab-'+keys[n]); if(t) t.focus();
});
panel.addEventListener('click',e=>{
  const t=e.target.closest('.tile');
  if(t){choose(tab,t.dataset.id);return;}
  const sk=e.target.closest('[data-skin]');
  if(sk){S.skin=+sk.dataset.skin;renderStage();buildPanel();save();return;}
  const bg=e.target.closest('[data-bg]');
  if(bg){S.bg=+bg.dataset.bg;renderStage();buildPanel();save();}
});
colorsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-color]'); if(!b) return;
  S.colors[tab]=b.dataset.color;
  renderStage(); buildPanel(); save();
});
$('random').addEventListener('click',randomize);
$('reset').addEventListener('click',()=>{S=defaults();renderStage();buildPanel();announce();save();});

/* ---------- boot ---------- */
load();
renderStage(); buildTabs(); buildPanel(); announce();

/* test hook (used by automated checks) */
window.__dressup={CATS,ITEMS,figure,SKINS,COLORS:CLOTHC};
})();
</script>

</html>
